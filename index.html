.dcard .nrow { height: 132px; }
.dcard .ncell { aspect-ratio: auto !important; }
.dcard .ncollage { max-height: 266px; overflow: hidden; }
.cchip.expchip { border-left-color: var(--c) !important; }

/* Today stands out on the calendar */
.cal-day.today { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); box-shadow: inset 0 0 0 2px var(--accent); position: relative; z-index: 1; }
.cal-day.today .dnum { background: var(--accent); color: var(--on-accent, #fff); width: 26px; height: 26px; font-size: 13px; }
.cal-week .cal-day.today::after { content: 'Today'; position: absolute; top: 9px; right: 8px; font: 700 10px var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.renewrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
.renewrow .chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.renewrow select.ctl { width: auto; padding: 4px 8px; font-size: 12.5px; }
.noteedit .row2 { grid-template-columns: 1fr auto; display: grid; gap: 8px; }
.attbtns { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; opacity: 0; }
.attwrap:hover .attbtns, .attwrap:focus-within .attbtns { opacity: 1; }
.attact { background: rgba(0,0,0,.6); color: #fff; border-radius: 50%; padding: 4px; display: grid; place-items: center; }
.attact svg { width: 12px; height: 12px; stroke: #fff; }
.attarch { margin-top: 2px; }
.attarch summary { cursor: pointer; font-size: 12.5px; color: var(--muted); padding: 4px 0; }
.attarch .attopen { opacity: .7; }
@media (hover: none) { .attbtns { opacity: 1; } }
.ntabs { display: flex; gap: 4px; max-width: 620px; margin: 0 auto 14px; padding: 3px; border-radius: 11px; background: color-mix(in srgb, var(--line) 55%, transparent); overflow-x: auto; }
.ntab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.ntab svg { width: 15px; height: 15px; }
.ntab .cnt { font-weight: 500; font-size: 12px; opacity: .8; }
.ntab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.ntab:hover { color: var(--ink); }
.expbanner { max-width: 620px; margin: 0 auto 14px; border: 1px solid #f1b5ae; background: #fdecea; border-radius: 12px; padding: 10px 12px; color: #6b1d17; }
:root[data-theme="dark"] .expbanner { background: #3a1d1a; border-color: #6b2f29; color: #f5c6c1; }
.expbhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-bottom: 4px; }
.expbhead svg { width: 16px; height: 16px; color: #b3261e; }
.expbhead span { color: inherit; opacity: .8; font-size: 12.5px; }
.expbrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid rgba(179,38,30,.15); font-size: 13px; }
.expbrow .linkbtn { font-size: 13px; color: inherit; }
.expbrow .spacer { flex: 1; }
.expbrow .chipbtn { display: inline-flex; align-items: center; gap: 5px; }
.expbrow .chipbtn svg { width: 13px; height: 13px; }

/* Counts in section headings: a small gray pill, so "Tuesday, Dec 1" and "2" don't run together */
.section-head .n, .nlabel .n { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px; border-radius: 9px; background: color-mix(in srgb, var(--line) 75%, transparent); color: var(--muted); font-size: 11px; font-weight: 600; line-height: 17px; text-align: center; letter-spacing: 0; text-transform: none; }
.section-head.overdue .n { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
/* phone: slide when swiping between sections */
@keyframes swl { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes swr { from { transform: translateX(-28px); opacity: .4; } to { transform: none; opacity: 1; } }
#content.swl { animation: swl .18s ease-out; } #content.swr { animation: swr .18s ease-out; }

/* ---------- Phone month: names in each day, labeled bars (like Google Calendar's phone month view) ---------- */
.pcal { padding: 4px 0 0; overflow: hidden; }
.pcal-weeks { display: block; }
.pweek { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.pbars { position: absolute; left: 0; right: 0; top: 23px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 14px; row-gap: 2px; pointer-events: none; z-index: 1; }
.pbar { margin: 0 1px; padding: 0 4px; border-radius: 3px; font-size: 9.5px; font-weight: 600; line-height: 14px; white-space: nowrap; overflow: hidden; background: color-mix(in srgb, var(--c) 22%, var(--surface)); color: color-mix(in srgb, var(--c) 75%, #000); }
.pbar.cl { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
.pbar.cr { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
.pday { grid-row: 1; position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 0; min-height: 84px; padding: calc(24px + var(--lanes, 0) * 16px) 1px 4px; border-radius: 0; text-align: left; border-left: 1px solid color-mix(in srgb, var(--line) 60%, transparent); min-width: 0; }
.pday:first-of-type { border-left: 0; }
.pday .pnum { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font-size: 12px; font-weight: 600; }
.pday.sel { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.pday.today .pnum { background: var(--accent); color: var(--on-accent, #fff); }
.pday.sel:not(.today) .pnum { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.pchips { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pch { display: block; font-size: 10px; line-height: 13px; padding: 0 3px; border-radius: 3px; white-space: nowrap; overflow: hidden; color: var(--ink); }
.pch.pev { background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: color-mix(in srgb, var(--c) 78%, #000); font-weight: 600; }
.pch.ptask { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 22%, transparent); }
.pch.ptask.over { color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 45%, transparent); }
.pch.ptask.done { text-decoration: line-through; color: var(--muted); box-shadow: none; }
.pch.ptask.ghost { opacity: .6; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 15%, transparent); }
.pch.pnotec { background: color-mix(in srgb, var(--note-c, #c99000) 16%, var(--surface)); font-style: italic; }
.pmore { font-size: 10px; font-weight: 600; color: var(--muted); padding: 0 3px; }
:root[data-theme="dark"] .pbar, :root[data-theme="dark"] .pch.pev { color: color-mix(in srgb, var(--c) 55%, #fff); background: color-mix(in srgb, var(--c) 30%, var(--surface)); }
.pcal, .pagenda, .pcal-bar { flex: none; }
.notechip.more { font-style: normal; color: var(--muted); }
.pnote span { white-space: pre-line; }

/* ---------- Journal (outline per day) ---------- */
.ico-journal { color: #8a5cc2; }
.jtop { display: flex; align-items: center; gap: 8px; max-width: 880px; margin: 0 auto 10px; justify-content: flex-end; }
.jtop .ctl { width: auto; padding: 5px 8px; }
.jentry { max-width: 880px; margin: 0 auto 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; }
.jentry.editing { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
#detail .jentry { margin: 0; padding: 6px 8px 8px; }
.jhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.jdate { font: 700 14px var(--font-display); color: var(--ink); padding: 0; }
.jdate:hover { color: var(--accent); }
.jtoday { font: 700 10px var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.jbody { cursor: text; }
.ol { display: flex; flex-direction: column; }
.ol-line { display: flex; align-items: center; gap: 8px; padding-left: calc(var(--lvl, 0) * 22px); min-height: 26px; }
.ol-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); opacity: .55; flex: none; }
.ol-line[style*="--lvl:1"] .ol-dot, .ol-line[style*="--lvl:3"] .ol-dot { background: transparent; box-shadow: inset 0 0 0 1.3px var(--ink); }
.ol-in { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); padding: 3px 0; outline: none; resize: none; overflow: hidden; width: 100%; field-sizing: content; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; display: block; }
.ol-line:has(> textarea.ol-in) { align-items: flex-start; flex-wrap: wrap; row-gap: 0; }
.ol-line > textarea.ol-in { flex: 1 1 180px; width: auto; }
.ol-line:has(> textarea.ol-in) > .ol-dot { margin-top: 11px; }
.ol-line:has(> textarea.ol-in) > .check { margin-top: 3px; }
.ol-line > .jtchip { flex: none; margin-top: 3px; }
.ol-line:has(> textarea.ol-in) > .jtchip { margin-left: auto; }
.ol-txt { font-size: 14px; line-height: 1.45; padding: 2px 0; word-break: break-word; }
.ol.ro .ol-line { align-items: baseline; }
.ol.ro .ol-dot { transform: translateY(-2px); }
.ol-tools { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.ol-tools .chipbtn { display: inline-flex; align-items: center; gap: 4px; }
.ol-tools svg { width: 13px; height: 13px; }
.ol-tools .hint { margin-left: 4px; }
.jentry .attgrid { margin-top: 8px; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.jlink { color: var(--accent); font-weight: 600; padding: 0; font-size: inherit; background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: 4px; padding: 0 3px; }
.jlink:hover { text-decoration: underline; }
.jlinks { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.jlinks svg { width: 13px; height: 13px; }
.jmore { display: block; margin: 6px auto 20px; }
.pnote { display: flex; gap: 8px; align-items: flex-start; text-align: left; }
.pnote > svg { width: 16px; height: 16px; flex: none; margin-top: 5px; color: #8a5cc2; }
.pnote .ol { flex: 1; }
/* journal: separate entries in a day */
.jitem { position: relative; padding: 2px 34px 6px 0; }
.jitem + .jitem { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px; }
.jcam { position: absolute; top: 2px; right: 0; padding: 5px; border-radius: 7px; color: var(--muted); display: grid; place-items: center; }
.jcam svg { width: 16px; height: 16px; }
.jcam:hover { background: var(--hover); color: var(--accent); }
.jentry:not(.editing) .jitem { padding-right: 0; }
#detail .jentry .jhead { display: none; }
.pnotes { flex: 1; min-width: 0; }
.jsep { border: 0; border-top: 1px dashed var(--line); margin: 4px 0; }
.jsug { position: fixed; z-index: 70; min-width: 200px; max-width: 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; }
.jsug[hidden] { display: none; }
.jsug-i { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 7px; font-size: 14px; color: var(--ink); }
.jsug-i svg { width: 14px; height: 14px; color: var(--accent); flex: none; }
.jsug-i.on, .jsug-i:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.jsug-hint, .jsug-hint:hover { color: var(--muted, #6b7280); background: none; cursor: default; }
.jsug-hint { font-size: 11px; color: var(--muted); padding: 4px 10px 2px; }
/* journal tasks, folding, pages, jump */
button.ol-dot { padding: 0; border: 0; cursor: pointer; width: 7px; height: 7px; }
button.ol-dot.fold:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); opacity: 1; }
button.ol-dot.folded { background: var(--accent); opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.ol-line.hid { display: none; }
.ol-line .check.small.jt { width: 17px; height: 17px; border-width: 1.6px; margin: 0; flex: none; }
.ol-line .check.small.jt svg { width: 10px; height: 10px; }
.ol-line .check.jt.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
.ol-line.isdone .ol-in, .ol-line.isdone .ol-txt { text-decoration: line-through; color: var(--muted); }
.jtchip { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); white-space: nowrap; flex: none; padding-left: 6px; }
.jtchip svg { width: 11px; height: 11px; }
.jtchip.over { color: var(--danger); }
.jfrom { cursor: pointer; }
.jfrom:hover { color: var(--accent); }
.jpage { border-color: color-mix(in srgb, #8a5cc2 40%, var(--line)) !important; box-shadow: none !important; }
.jpage .jhead .jdate { color: #8a5cc2; }
.jmentions { max-width: 880px; margin: 16px auto 6px !important; }
.jnone { max-width: 880px; margin: 12px auto; }
.jkeys { margin-right: auto; }
@media (max-width: 760px) { .jkeys { display: none; } }
#jump { align-items: start; padding-top: 12vh; }
.jumpbox { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; }
.jumpbox .ctl { font-size: 16px; padding: 10px 12px; }
.jumplist { margin-top: 6px; display: flex; flex-direction: column; }
.jumplist .jsug-i { gap: 10px; }
.jumplist .jsug-i > span:first-of-type { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jumplist .jsug-i .hint { font-size: 12px; }
.cchip.taskchip.done { opacity: .6; }
.cchip.taskchip.done .ctext { text-decoration: line-through; }
.cchip.taskchip.done .ring { background: var(--accent); border-color: var(--accent); }
/* checkboxes and bullets inside notes */
.ntools { display: flex; gap: 6px; flex-wrap: wrap; }
.ntools .chipbtn { display: inline-flex; align-items: center; gap: 5px; }
.ntools svg { width: 13px; height: 13px; }
.nrich { display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; line-height: 1.45; }
.noteedit .nrich { font-size: 14px; }
.nrich-wrap { cursor: text; border-radius: 8px; padding: 4px 2px; min-height: 60px; }
.nrich-wrap:hover { background: color-mix(in srgb, var(--line) 30%, transparent); }
.nr-l { display: flex; align-items: flex-start; gap: 8px; padding-left: calc(var(--ind, 0) * 22px); word-break: break-word; }
.nr-l.done > span { text-decoration: line-through; color: var(--muted); }
.nbox { width: 16px; height: 16px; border: 1.6px solid color-mix(in srgb, var(--ink) 55%, transparent); border-radius: 4px; display: grid; place-items: center; flex: none; margin-top: 2px; color: transparent; padding: 0; background: transparent; }
.nbox svg { width: 11px; height: 11px; stroke-width: 3; }
.nbox.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
.nbul { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; flex: none; margin: 8px 5px 0 5px; display: inline-block; }
.ntools .nbul { margin: 0; }
/* waiting on someone */
.waitchip { display: inline-flex; align-items: center; gap: 4px; color: #8a5a00; }
.waitchip svg { width: 12px; height: 12px; }
.waitchip b.jlink { font-weight: 600; background: none; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.waitchip.due { color: #b3261e; font-weight: 600; }
:root[data-theme="dark"] .waitchip { color: #f2c46b; } :root[data-theme="dark"] .waitchip.due { color: #f19a92; }
.waitbox { border: 1px solid color-mix(in srgb, #c99000 40%, var(--line)); background: color-mix(in srgb, #c99000 8%, var(--surface)); border-radius: 10px; padding: 10px 12px; }
.waitbox.due { border-color: color-mix(in srgb, #b3261e 45%, var(--line)); background: color-mix(in srgb, #b3261e 7%, var(--surface)); }
.waitbox .field-label { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.waitbox .field-label svg, .toggle-row svg { flex: none; }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.row-btns select.ctl { width: auto; padding: 4px 8px; font-size: 12.5px; }
.waitform .row2 { grid-template-columns: 1fr auto; display: grid; gap: 8px; }
.waitform select.ctl { width: auto; }
/* Settings → Pages & swiping */
.pglist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pgrow { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.pgrow:first-child { border-top: 0; }
.pgrow .chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.pgrow .spacer { flex: 1; }
.pgrow.off .chk { color: var(--muted); }
.pgrow .iconbtn { padding: 8px; }
.pgrow .iconbtn svg { transform: rotate(180deg); }
.pgrow .iconbtn.down svg { transform: none; }
.pgrow .iconbtn[disabled] { opacity: .25; pointer-events: none; }
.pgtag { font: 700 10px var(--font-body); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); margin-left: 4px; }
.pgpreview { margin: 12px 0 4px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); font-size: 13.5px; }

/* Meeting notes: a journal entry with a meeting name */
.jmeet { display: flex; align-items: center; gap: 6px; margin: 2px 0 4px; font-weight: 700; color: var(--ink); }
.jmeet > svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
.jmeet .jlink { font-weight: 700; }
.jmeet-in { flex: 1; min-width: 0; border: 0; border-bottom: 1px dashed var(--line); background: transparent; color: var(--ink); font: 700 14px var(--font-display, inherit); padding: 3px 0; outline: none; }
.jmeet-in:focus { border-bottom-color: var(--accent); }
.jmeet-in::placeholder { color: var(--muted); font-weight: 500; }
.jmeet-time { font-size: 12px; font-weight: 500; color: var(--muted); }
.jmeet-all { font-size: 12px; }
.jmeet.sm { font-size: 12.5px; margin: 6px 0 2px; }
.jmeet.sm > svg { width: 13px; height: 13px; }
.jitem.ismeet { border-left: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); padding-left: 10px; }
.jbody.hint { font-size: 12.5px; cursor: pointer; }
.meetchip { font-style: normal; font-weight: 600; border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.meetchip svg { color: var(--accent); }
.evmeet { display: inline-flex; margin-left: 4px; vertical-align: -1px; }
.evmeet svg { width: 11px; height: 11px; }
.pch.pmeet { font-style: normal; font-weight: 600; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.jmeets-head { display: flex; align-items: center; gap: 6px; margin-top: 18px; }
.jmeets-head svg { width: 15px; height: 15px; color: var(--accent); }
.jmeetrow .jitem { padding-right: 0; }
.jmeet-clock { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-weight: 500; font-size: 12.5px; cursor: pointer; border-radius: 7px; padding: 2px 4px; }
.jmeet-clock svg { width: 15px; height: 15px; }
.jmeet-clock:hover { background: var(--hover); color: var(--accent); }
.jmeet-tin { border: 0; background: transparent; color: var(--ink); font: inherit; width: 0; padding: 0; opacity: 0; transition: none; }
.jmeet-clock.on .jmeet-tin, .jmeet-clock:focus-within .jmeet-tin { width: 92px; opacity: 1; }
.jmeet-clock.on { color: var(--ink); }
.jmeet-clock.on svg { color: var(--accent); }
.jmeet .jmeet-time { font-weight: 600; color: var(--accent); margin-right: 2px; }
.jmeetrow .jmeet-time { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.jentry.editing .jitem { padding-right: 64px; }
.jdel { right: 30px; }
.jdel:hover { color: var(--danger, #b3261e); }
.jmeet-tin::-webkit-calendar-picker-indicator { display: none; }
#detail .jentry.editing .jitem.jlast .ol { min-height: 132px; cursor: text; }
.jmeet-in { flex: 1 1 170px; width: 0; min-width: 0; }
.jmeet-clock { flex: none; }
.jmeet { min-width: 0; flex-wrap: wrap; row-gap: 2px; }
#detail .d-scroll { overflow-x: hidden; }
/* A single document picture: the whole page, sharp */
.dcard .ncollage.whole { max-height: 440px; }
.dcard .ncollage.whole .nrow { height: auto; }
.dcard .ncollage.whole .ncell { aspect-ratio: var(--ar) !important; max-height: 440px; background: #fff; }
.dcard .ncollage.whole .ncell img { object-fit: contain; }

/* Calendar fits the window on any screen: weeks share the height, extra items fold into "+N more" */
@media (min-width: 601px) {
  .content.calview .calwrap { min-height: 300px; }
  .cal-week { flex: 1 1 0; min-height: calc(46px + var(--lanes, 0) * 20px); }
  .cal-week .cal-day { overflow: hidden; display: flex; flex-direction: column; }
  .cal-week .cal-items { flex: 1; min-height: 0; overflow: hidden; }
  .cal-week .cal-items > * { flex-shrink: 0; }
  .cmore { font-size: 11.5px; color: var(--muted); text-align: left; padding: 1px 6px; border-radius: 5px; flex: none; }
  .cmore:hover { background: var(--hover); color: var(--ink); }
}
/* Short laptop screens: a tighter header leaves more room for the month */
@media (min-width: 601px) and (max-height: 760px) {
  .head { padding-top: 14px; }
  .head h1 { font-size: 23px; }
  .qa-wrap { padding-top: 8px; }
  .qa input { padding: 10px 0; }
  .qa-preview { min-height: 22px; padding-top: 4px; }
  .content.calview { padding-bottom: 8px; }
  .content.calview .cal-bar { margin: 6px 0; }

}

/* Journal bullets: one size everywhere (lines with sub-points are clickable, with a bigger invisible tap area) */
.ol-dot, button.ol-dot { width: 6px; height: 6px; position: relative; }
button.ol-dot::after { content: ''; position: absolute; inset: -9px; border-radius: 50%; }
button.ol-dot.folded { box-shadow: none; }
.ol-line[style*="--lvl:1"] button.ol-dot.folded, .ol-line[style*="--lvl:3"] button.ol-dot.folded { background: var(--accent); }

.remrow { display: grid; grid-template-columns: 1fr 120px; gap: 6px; }
.presets .chipbtn.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* Notes and Important Documents: Google Keep-style card in the middle of the screen (computer) */
.paper-bg { position: fixed; inset: 0; z-index: 27; background: rgba(10,14,20,.45); }
.paper-bg[hidden] { display: none; }
.detail.paper-modal { position: fixed; z-index: 28; left: 50%; top: 7vh; right: auto; bottom: auto; transform: translateX(-50%); width: min(720px, calc(100vw - 48px)); max-width: none; max-height: 86vh; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 64px rgba(10,14,20,.28); overflow: hidden; }
.detail.paper-modal .d-scroll { padding: 18px 22px 12px; }
.detail.paper-modal .ntitle-in { font-size: 20px; font-weight: 600; }
.detail.paper-modal .nbody-in { min-height: 42vh; font-size: 15px; line-height: 1.55; border: 0; padding: 4px 0; background: transparent; box-shadow: none; resize: none; }
.detail.paper-modal .nbody-in:focus { outline: none; }
.detail.paper-modal .nrich-wrap { min-height: 42vh; font-size: 15px; line-height: 1.55; }
.detail.paper-modal .d-foot { padding: 10px 22px 14px; }
.nexp { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 4px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); font-size: 12.5px; color: var(--ink); }
.nexp svg { width: 15px; height: 15px; flex: none; margin-top: 1px; color: var(--accent); }
.nexp.expired { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
.nexp.expired svg { color: var(--danger); }
.nexps { margin: 10px 0 4px; display: grid; gap: 6px; }
.nexps .nexp { margin: 0; }
.nexp-head { font-size: 11.5px; color: var(--muted); }
.nexp-from { color: var(--muted); font-weight: 400; }

/* Journal: entries on the left, a month calendar and what's coming up on the right */
.jlayout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; max-width: 1340px; margin: 0 auto; align-items: start; }
.jtop .jtmr { margin-right: auto; }
.jside { display: none; }
@media (min-width: 1280px) {
  .jlayout { grid-template-columns: minmax(0, 1fr) 280px; }
  .jside { display: grid; gap: 10px; position: sticky; top: 0; }
  .jtop .jtmr { display: none; }
  .jmain .jentry, .jmain .jtop { max-width: none; }
}
.jcal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.jcal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 13.5px; }
.jcal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.jcal-wd { font-size: 10.5px; color: var(--muted); padding: 2px 0 4px; }
.jcal-d { position: relative; height: 32px; border-radius: 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.jcal-d:hover { background: var(--hover); }
.jcal-d.has::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.jcal-d.today { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); font-weight: 700; }
.jcal-d.sel { background: var(--accent); color: var(--on-accent, #fff); }
.jcal-d.sel.has::after { background: var(--on-accent, #fff); }
.jplan { justify-content: center; }
.jside-head { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.jahead { display: grid; gap: 4px; }
.jahead-row { display: grid; gap: 1px; text-align: left; padding: 7px 10px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; }
.jahead-row:hover { border-color: var(--accent); }
.jahead-row span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jside-none { margin: 0; font-size: 12px; }
.jtoday.jfuture { background: var(--accent-soft); color: var(--accent); }
.nbul.l1 { background: transparent; border: 1.3px solid currentColor; width: 6px; height: 6px; }
.nbul.l2 { border-radius: 1px; }
.nbody-in { tab-size: 4; }
.jsplit-h { order: 9; margin-left: auto; padding: 2px 8px; font-size: 11.5px; opacity: 0; transition: opacity .12s; }
.jentry:hover .jsplit-h, .jsplit-h:focus-visible { opacity: 1; }
@media (hover: none) { .jsplit-h { display: none; } }

.icslist { display: grid; gap: 2px; max-height: 46vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin: 6px 0 10px; }
.icsrow { display: grid; grid-template-columns: auto 92px 70px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; font-size: 13px; cursor: pointer; }
.icsrow:hover { background: var(--hover); }
.icsrow.off { color: var(--muted); }
.icsrow .icsd { font-weight: 600; font-variant-numeric: tabular-nums; }
.icsrow .icst { color: var(--muted); font-variant-numeric: tabular-nums; }
.icsrow .icsn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icsrow em { font-style: normal; font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 99px; margin-left: 4px; }

.icsgone { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin: 4px 0 8px; }

<script>
/* Quick-add parser + date/recurrence helpers. Pure functions, no DOM. */
(function (root) {
  const WD = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const WD_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  const MON_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const WD_RE = '(sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)';
  const MON_RE = '(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
  const B = '(?:^|\\s)';       // left boundary
  const E = '(?=\\s|$|[,.;])'; // right boundary
  const PRE = '(?:(?:on|by|due)\\s+)?';

  const wdIndex = s => WD.indexOf(s.slice(0, 3).toLowerCase());
  const monIndex = s => MON.indexOf(s.slice(0, 3).toLowerCase());
  const pad = n => String(n).padStart(2, '0');

  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function addMonths(d, n, anchorDay) {
    const day = anchorDay || d.getDate();
    const y = d.getFullYear(), m = d.getMonth() + n;
    const ty = y + Math.floor(m / 12), tm = ((m % 12) + 12) % 12;
    return new Date(ty, tm, Math.min(day, daysInMonth(ty, tm)));
  }
  function diffDays(a, b) { return Math.round((startOfDay(a) - startOfDay(b)) / 86400000); }

  // Next occurrence of a weekday, never today ("fri" on a Friday = next Friday)
  function nextWeekday(today, idx) {
    let delta = (idx - today.getDay() + 7) % 7;
    if (delta === 0) delta = 7;
    return addDays(today, delta);
  }

  function toLocalDT(d) { return toISO(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function parseLocalDT(s) { const [a, b] = s.split('T'); const d = fromISO(a); const [h, m] = (b || '00:00').split(':').map(Number); d.setHours(h, m); return d; }
  function reminderLabel(dt, now) { const [a, b] = dt.split('T'); return dueLabel(a, now) + ' ' + fmtTime(b); }

  function norm(s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ''); }

  function findList(name, lists) {
    const n = norm(name);
    if (!n) return null;
    return lists.find(l => norm(l.name) === n) || lists.find(l => norm(l.name).startsWith(n)) || null;
  }

  /* First due date for a recurrence when the user gave no explicit date. */
  function firstOccurrence(recur, today) {
    if (recur.byDay && recur.byDay.length) {
      for (let i = 0; i < 7; i++) { const d = addDays(today, i); if (recur.byDay.includes(d.getDay())) return d; }
    }
    if (recur.freq === 'month' && recur.monthDay) {
      const y = today.getFullYear(), m = today.getMonth();
      const cand = new Date(y, m, Math.min(recur.monthDay, daysInMonth(y, m)));
      return cand >= today ? cand : addMonths(cand, 1, recur.monthDay);
    }
    return today;
  }

  /* Next due date after completing a recurring task. dueISO is the current due date. */
  function nextOccurrence(dueISO, recur, now) {
    const base = dueISO ? fromISO(dueISO) : startOfDay(now || new Date());
    const n = recur.interval || 1;
    let d;
    if (recur.byDay && recur.byDay.length) {
      d = addDays(base, 1);
      for (let i = 0; i < 7 && !recur.byDay.includes(d.getDay()); i++) d = addDays(d, 1);
    } else if (recur.freq === 'day') d = addDays(base, n);
    else if (recur.freq === 'week') d = addDays(base, 7 * n);
    else if (recur.freq === 'month') d = addMonths(base, n, recur.monthDay || recur.anchorDay || base.getDate());
    else if (recur.freq === 'year') d = addMonths(base, 12 * n, recur.anchorDay || base.getDate());
    else d = addDays(base, 1);
    return toISO(d);
  }

  function recurText(r) {
    if (!r) return '';
    const n = r.interval || 1;
    if (r.byDay && r.byDay.length) {
      const s = [...r.byDay].sort().join(',');
      if (s === '1,2,3,4,5') return 'Every weekday';
      if (s === '0,6') return 'Every weekend';
      return 'Every ' + [...r.byDay].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(i => WD_LONG[i].slice(0, 3)).join(', ');
    }
    if (r.freq === 'month' && r.monthDay) return 'Every month on the ' + ordinal(r.monthDay);
    const unit = { day: 'day', week: 'week', month: 'month', year: 'year' }[r.freq];
    return n === 1 ? 'Every ' + unit : 'Every ' + n + ' ' + unit + 's';
  }
  function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

  function fmtTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    const hh = ((h + 11) % 12) + 1;
    return hh + (m ? ':' + pad(m) : '') + (h < 12 ? 'am' : 'pm');
  }

  function dueLabel(dueISO, now) {
    if (!dueISO) return '';
    const today = startOfDay(now || new Date());
    const d = fromISO(dueISO);
    const diff = diffDays(d, today);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff === -1) return 'Yesterday';
    if (diff > 1 && diff < 7) return WD_LONG[d.getDay()];
    const s = WD_LONG[d.getDay()].slice(0, 3) + ', ' + MON_SHORT[d.getMonth()] + ' ' + d.getDate();
    return d.getFullYear() === today.getFullYear() ? s : s + ', ' + d.getFullYear();
  }

  /*
   * parseQuick("Pay rent every month on the 1st 9am #bills", lists)
   * -> { title, due, time, recur, listId, listName, tokens: [{kind,text}] }
   */
  function parseQuick(input, lists, now, opts) {
    now = now || new Date();
    const today = startOfDay(now);
    // [[Name]] links are kept as they are: a name like [[June]] or [[Friday]] is never read as a date
    const links = [];
    let text = ' ' + String(input).replace(/\[\[[^\[\]\n]*\]\]/g, m => '\u27e6' + (links.push(m) - 1) + '\u27e7') + ' ';
    const out = { title: '', due: null, time: null, recur: null, listId: null, listName: null, tags: [], start: null, tokens: [] };

    function take(re, fn) {
      const m = text.match(re);
      if (!m) return false;
      if (fn(m) === false) return false;
      text = text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length);
      return true;
    }
    const rx = (s) => new RegExp(s, 'i');


    // date range for multi-day events: "dec 20 - dec 31", "jan 5 to jan 9", "fri until next week"
    if (!opts || !opts.noRange) {
      const words = text.trim().split(/\s+/);
      let best = null;
      for (let i = 1; i < words.length - 1 && !best; i++) {
        if (!/^(-|–|—|to|until|till|thru|through)$/i.test(words[i])) continue;
        for (let a = Math.min(3, i); a >= 1 && !best; a--) {
          const left = words.slice(i - a, i).join(' ');
          const L = parseQuick('x ' + left, [], now, { noRange: true });
          if (!(L.due && L.title === 'x' && !L.time && !L.recur && !L.start)) continue;
          for (let b = Math.min(3, words.length - 1 - i); b >= 1; b--) {
            const right = words.slice(i + 1, i + 1 + b).join(' ');
            const R = parseQuick('x ' + right, [], now, { noRange: true });
            if (R.due && R.title === 'x' && !R.time && !R.recur && !R.start) { best = { s: i - a, e: i + b, from: L.due, to: R.due }; break; }
          }
        }
      }
      if (best) {
        const shiftY = (iso, n) => { const d = fromISO(iso); d.setFullYear(d.getFullYear() + n); return toISO(d); };
        let from = best.from, to = best.to;
        if (to < from) to = shiftY(to, 1);
        // A range already under way (e.g. "nov 20 - nov 27" on Nov 23) means this year, not next
        const T = toISO(today);
        if (!/\b\d{4}\b/.test(text) && from > T && shiftY(from, -1) <= T && shiftY(to, -1) >= T) { from = shiftY(from, -1); to = shiftY(to, -1); }
        out.rangeFrom = from; out.end = to;
        let s0 = best.s; if (s0 > 0 && /^from$/i.test(words[s0 - 1])) s0--;
        text = ' ' + words.slice(0, s0).concat(words.slice(best.e + 1)).join(' ') + ' ';
      }
    }

    // start date: "start mon", "starts next week", "from dec 5"
    {
      const m = text.match(/(^|\s)(starts?|starting|from)\s+/i);
      if (m) {
        const after = text.slice(m.index + m[0].length);
        const words = after.split(/\s+/).filter(Boolean);
        for (let n = Math.min(3, words.length); n >= 1; n--) {
          const cand = words.slice(0, n).join(' ');
          const r = parseQuick('x ' + cand, [], now, { noRange: true });
          if (r.due && r.title === 'x' && !r.time && !r.recur && !r.tags.length) {
            out.start = r.due;
            const end = m.index + m[0].length + after.indexOf(cand) + cand.length;
            text = text.slice(0, m.index) + ' ' + text.slice(end);
            break;
          }
        }
      }
    }

    // list: #name
    take(/(^|\s)#([^\s#]+)/, m => {
      const l = findList(m[2], lists || []);
      if (!l) { out.tokens.push({ kind: 'warn', text: 'No list "' + m[2] + '"' }); return false; }
      out.listId = l.id; out.listName = l.name;
    });

    // recurrence
    take(rx(B + '(?:every\\s+weekday|weekdays|every\\s+work\\s*day)' + E), () => { out.recur = { freq: 'week', interval: 1, byDay: [1, 2, 3, 4, 5] }; }) ||
    take(rx(B + '(?:every\\s+weekend|weekends)' + E), () => { out.recur = { freq: 'week', interval: 1, byDay: [0, 6] }; }) ||
    take(rx(B + 'every\\s+(' + WD_RE + '(?:\\s*(?:,|and|&)\\s*' + WD_RE + ')*)' + E), m => {
      const days = m[1].split(/\s*(?:,|and|&)\s*/i).map(wdIndex).filter(i => i >= 0);
      out.recur = { freq: 'week', interval: 1, byDay: [...new Set(days)] };
    }) ||
    take(rx(B + 'every\\s+(?:month\\s+on\\s+the\\s+)?(\\d{1,2})(?:st|nd|rd|th)' + E), m => {
      const d = Number(m[1]); if (d < 1 || d > 31) return false;
      out.recur = { freq: 'month', interval: 1, monthDay: d };
    }) ||
    take(rx(B + '(?:every\\s+(other\\s+|\\d+\\s+)?(day|week|month|year)s?|(daily|weekly|monthly|yearly|annually))' + E), m => {
      if (m[3]) {
        const f = { daily: 'day', weekly: 'week', monthly: 'month', yearly: 'year', annually: 'year' }[m[3].toLowerCase()];
        out.recur = { freq: f, interval: 1 };
      } else {
        const iv = !m[1] ? 1 : /other/i.test(m[1]) ? 2 : Number(m[1]);
        out.recur = { freq: m[2].toLowerCase(), interval: Math.max(1, iv) };
      }
    });

    // reminder: "remind 5pm", "remind me at 8:30am", "remind 30m before", "remind 1h before"
    take(rx(B + 'remind(?:\\s+me)?\\s+(\\d+)\\s*(m|mins?|minutes?|h|hrs?|hours?)\\s+before' + E), m => {
      out.remindOffset = Number(m[1]) * (/^h/i.test(m[2]) ? 60 : 1);
    }) ||
    take(rx(B + 'remind(?:\\s+me)?(?:\\s+at)?\\s+(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm)?' + E), m => {
      let h = Number(m[1]); const mi = Number(m[2] || 0);
      if (m[3]) { h = h % 12; if (m[3].toLowerCase() === 'pm') h += 12; } else if (!m[2] && h >= 1 && h <= 6) h += 12;
      if (h > 23 || mi > 59) return false;
      out.remindTime = pad(h) + ':' + pad(mi);
    });

    // time
    take(rx(B + '(?:at\\s+|@\\s*)?(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm)' + E), m => {
      let h = Number(m[1]) % 12; if (m[3].toLowerCase() === 'pm') h += 12;
      const mi = Number(m[2] || 0); if (h > 23 || mi > 59) return false;
      out.time = pad(h) + ':' + pad(mi);
    }) ||
    take(rx(B + '(?:at\\s+)?([01]?\\d|2[0-3]):([0-5]\\d)' + E), m => { out.time = pad(Number(m[1])) + ':' + m[2]; }) ||

    const mins = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
    let now = today.h * 60 + today.m, label = '';
    let list = PRAYERS.filter(x => c.prayers.includes(x[0])).map(([k, n]) => [n, d[k]]);
    // after the last one today, show tomorrow's

      if (d2 && d2.fajr) { d = d2; now -= 1440; label = ' · tomorrow'; list = PRAYERS.filter(x => c.prayers.includes(x[0])).map(([k, n]) => [n, d[k]]); }

  // Aladhan's Dubai method (IACAD blocks outside access). Checked against IACAD's official November 2026 times:
  // Fajr, Dhuhr, Asr and Isha match or are within a minute; Maghrib is a minute early and Sunrise 4 minutes late,
  // so those two are corrected.
  async function refreshPrayer() {
    const today = zoneNow('Asia/Dubai').date, have = news.prayer && news.prayer.days;
    const tmr = new Date(Date.parse(today + 'T12:00:00Z') + 86400000).toISOString().slice(0, 10);
    if (have && have[today] && have[today].fajr && have[tmr] && Date.now() - news.prayer.at < 12 * 3600000) return;
    const days = {};
    const hm = (v, add) => { const [h, mm] = String(v || '').slice(0, 5).split(':').map(Number); const t = h * 60 + mm + (add || 0); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
    try {
      for (const ymd of [today, tmr]) {
        const [y, m] = ymd.split('-'); if (Object.keys(days).some(k => k.startsWith(y + '-' + m))) continue;
        const r = await fetch('https://api.aladhan.com/v1/calendarByCity/' + y + '/' + Number(m) + '?city=Dubai&country=AE&method=16', { cache: 'no-store' });
        const j = r.ok ? await r.json() : null;
        for (const d of (j && j.data) || []) {
          const g = String(d.date && d.date.gregorian && d.date.gregorian.date || '').split('-'); if (g.length !== 3) continue;
          const t = d.timings;
          days[g[2] + '-' + g[1] + '-' + g[0]] = { fajr: hm(t.Fajr), sunrise: hm(t.Sunrise, -4), dhuhr: hm(t.Dhuhr), asr: hm(t.Asr), maghrib: hm(t.Maghrib, 1), isha: hm(t.Isha) };
        }
      }
      news.prayer = days[today] ? { at: Date.now(), days } : Object.assign({}, news.prayer, { err: true });
    } catch (e) { news.prayer = Object.assign({}, news.prayer, { err: true }); }
  }

  function renderCalendar() {

      '<button type="button" class="iconbtn" data-cal="-1" aria-label="Previous month">' + I.left + '</button><button type="button" class="chipbtn" data-cal="0">Today</button><button type="button" class="iconbtn" data-cal="1" aria-label="Next month">' + I.right + '</button>' +
      '<span class="cal-legend"><span class="lgs"><i style="background:' + tc('yearly') + '"></i>Yearly</span><span class="lgs"><i style="background:' + tc('event') + '"></i>Event</span>' +

  /* ---------- calendar link (.ics feed) ---------- */

  /* ====================== Notes, Documents and files (photos & PDFs on anything) ====================== */
  const isKNote = t => t.type === 'note';
  const isDoc = t => t.type === 'doc';
  const isPaper = t => !!t && (t.type === 'note' || t.type === 'doc');
  const paperView = v => v.startsWith('notes') || v === 'docs';
  const touchNote = n => { n.editedAt = Date.now(); };

  // ---- locked items: body, checklist and number are scrambled with a passphrase (AES-GCM) before they're saved or synced
  const SEALED = ['body', 'items', 'number'];
  const vault = { key: null, plain: {}, json: {}, sealedAs: {}, timer: null, hiddenAt: 0, again: false, busy: false };
  const vaultItem = () => S.tasks.find(t => t.type === 'vault');
  const shut = t => !!(t && t.locked && !vault.plain[t.id]);
  // A view of an item where locked fields read/write the unlocked copy kept in memory
  function E(t) {
    if (!t || !t.locked) return t;
    const p = vault.plain[t.id]; if (!p) return t;
    return new Proxy(t, { get: (o, k) => SEALED.includes(k) ? p[k] : o[k], set: (o, k, v) => { if (SEALED.includes(k)) p[k] = v; else o[k] = v; return true; } });
  }
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pass, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function encBytes(u8, key) { const iv = crypto.getRandomValues(new Uint8Array(12)); const c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key || vault.key, u8)); const out = new Uint8Array(12 + c.length); out.set(iv); out.set(c, 12); return out; }
  async function decBytes(u8, key) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.subarray(0, 12) }, key || vault.key, u8.subarray(12))); }
  const encStr = async (s, key) => b64(await encBytes(new TextEncoder().encode(s), key));
  const decStr = async (s, key) => new TextDecoder().decode(await decBytes(unb64(s), key));
  const allItems = () => S.tasks.concat(S.trash.tasks);

  async function openPlain() {
    for (const t of allItems()) {
      if (!t.locked || !t.sealed || (vault.plain[t.id] && vault.sealedAs[t.id] === t.sealed)) continue;
      try { const j = await decStr(t.sealed); vault.plain[t.id] = JSON.parse(j); vault.json[t.id] = j; vault.sealedAs[t.id] = t.sealed; } catch (e) { }
    }
  }
  // Re-scramble unlocked copies that changed (called from save())
  async function reseal() {
    if (!vault.key) return;
    if (vault.busy) { vault.again = true; return; }
    vault.busy = true; let ch = false;
    try {
      for (const t of allItems()) {
        const p = vault.plain[t.id]; if (!t.locked || !p) continue;
        const j = JSON.stringify(p); if (vault.json[t.id] === j) continue;
        t.sealed = await encStr(j); vault.json[t.id] = j; vault.sealedAs[t.id] = t.sealed; ch = true;
      }
    } finally { vault.busy = false; }
    if (ch) { persistLocal(); schedulePush(); }
    if (vault.again) { vault.again = false; reseal(); }
  }
  // Another computer changed a locked item while it's open here
  let plainChecking = false;
  function checkPlainFresh() {
    if (!vault.key || plainChecking) return;
    if (!allItems().some(t => t.locked && t.sealed && vault.sealedAs[t.id] !== t.sealed)) return;
    plainChecking = true; openPlain().then(() => { plainChecking = false; render(); });
  }
  function lockVault(quiet) {

    vault.key = null; vault.plain = {}; vault.json = {}; vault.sealedAs = {};

    if (!$('#lightbox').hidden) { const n = taskById($('#lightbox').dataset.note); if (n && n.locked) $('#lightbox').hidden = true; }

  }
  function armAutoLock() { clearTimeout(vault.timer); if (vault.key) vault.timer = setTimeout(() => lockVault(), 10 * 60000); }

  function openVaultSheet(done) {

    ui.vaultDone = done || null;

      (setup ? '<p>Locked notes and documents are scrambled on this computer before they sync, so nobody can read them without this passphrase, not even the database. Locked items stay locked on every computer and open with the same passphrase.</p><p><b>Write it down somewhere safe.</b> If you forget it, locked items can’t be recovered.</p>'
        : '<p>Enter your passphrase. Items lock again after 10 minutes without use.</p>') +

  async function vaultSubmit() {

  async function encryptStored(key) { const b = await fget(key); if (!b) return false; await fput(key, new Blob([await encBytes(new Uint8Array(await b.arrayBuffer()))])); return true; }

  async function lockItem(raw) {
    if (!(await needVault())) return;

    (raw.attachments || []).forEach(a => { if (a.text) p.texts[a.id] = a.text; });

  }
  async function unlockItem(raw) {

      for (const key of [a.id, a.id + '_t']) { if (!(await fget(key))) { const b = await blobFor(a, key !== a.id, true); if (b) await fput(key, b); } }

    delete raw.sealed; delete raw.locked; delete vault.plain[raw.id];
    [].concat(raw.attachments || []).forEach(a => [a.id, a.id + '_t'].forEach(k => encUrls.delete(k)));

  }

  // ---- local file store (IndexedDB): originals + previews; synced to Supabase Storage when signed in
  let fdbP = null;
  function fdb() {
    if (!fdbP) fdbP = new Promise((res, rej) => { const r = indexedDB.open('tally-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return fdbP;
  }
  async function fput(k, blob) { const db = await fdb(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
  async function fget(k) { const db = await fdb(); return new Promise(res => { const r = db.transaction('files').objectStore('files').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); }
  async function fdel(k) { try { const db = await fdb(); db.transaction('files', 'readwrite').objectStore('files').delete(k); } catch (e) { } }
  const urlCache = {}, encUrls = new Set();
  // raw = true returns the stored bytes as they are (scrambled for locked items)
  async function blobFor(a, thumb, raw) {
    const key = a.id + (thumb ? '_t' : '');
    let b = await fget(key);
    if (!b && syncReady()) {
      try { const { data } = await sync.client.storage.from('attachments').download(sync.user.id + '/' + key); if (data) { b = data; fput(key, b); } } catch (e) { }
    }
    if (!b && thumb) return raw ? null : blobFor(a, false);
    if (b && a.enc && !raw) {
      if (!vault.key) return null;
      try { b = new Blob([await decBytes(new Uint8Array(await b.arrayBuffer()))], { type: thumb ? 'image/jpeg' : a.mime }); } catch (e) { return null; }
    }
    return b;
  }
  async function urlFor(a, thumb) {
    const key = a.id + (thumb ? '_t' : '');
    if (urlCache[key]) return urlCache[key];
    const b = await blobFor(a, thumb); if (!b) return null;
    if (a.enc) encUrls.add(key);
    return (urlCache[key] = URL.createObjectURL(b));
  }
  function hydrate(root) {
    (root || document).querySelectorAll('img[data-att]:not([data-done])').forEach(async img => {
      img.dataset.done = '1';
      const n = taskById(img.dataset.note); const a = n && (n.attachments || []).find(x => x.id === img.dataset.att);
      if (!a) return;
      const u = await urlFor(a, img.dataset.thumb === '1');
      if (u) img.src = u; else { const w = img.closest('.attwrap, .ncell'); if (w) w.classList.add('missing'); }
    });
